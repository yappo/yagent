[server]
default = "lmstudio"

[[server.servers]]
name = "lmstudio"
url = "http://127.0.0.1:1234"
token = "your-api-token"
model = "gpt-5"
# 文字列の duration 形式。未指定時は 20m
timeout = "20m"

[file]
# ファイル操作の許可範囲を設定
# 例: allow_paths = ["/home/user/project", "/tmp"]
allow_paths = []

[execution]
max_parallel_agents = 2
max_handoff_depth = 2
default_timeout = "120s"

[agent_catalog]
paths = []

[agents.coder]
model = "gpt-5"

# task はこの config.toml には書きません。
# task を使う場合は、別ファイルとして次のどちらかを作成します。
#   .yagent/tasks.toml
#   ~/.config/yagent/tasks.toml
#
# 例:
#   [[tasks]]
#   id = "go:test"
#   description = "Go のテストを実行"
#   command = "go"
#   args = ["test", "./..."]
#   risk = "medium"
#   allow_network = false
#   timeout = 300
#
#   [[mcpservers]]
#   id = "docs"
#   description = "Docs MCP server"
#   transport = "stdio"
#   command = "npx"
#   args = ["-y", "@example/docs-mcp"]
#   tool_prefix = "docs"
#   parallel_safe = false
